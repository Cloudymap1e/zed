[package]
edition = "2024"
name = "agent-transport-protocol"
version = "1.0.1"
license = "Apache-2.0"
publish = false

[features]
default = []
unstable = [
    "unstable_auth_methods",
    "unstable_boolean_config",
    "unstable_cancel_request",
    "unstable_elicitation",
    "unstable_end_turn_token_usage",
    "unstable_session_fork",
]
unstable_auth_methods = ["agent-transport-protocol-schema/unstable_auth_methods"]
unstable_boolean_config = ["agent-transport-protocol-schema/unstable_boolean_config"]
unstable_cancel_request = ["agent-transport-protocol-schema/unstable_cancel_request"]
unstable_elicitation = ["agent-transport-protocol-schema/unstable_elicitation"]
unstable_end_turn_token_usage = ["agent-transport-protocol-schema/unstable_end_turn_token_usage"]
unstable_mcp_over_agent_transport = ["agent-transport-protocol-schema/unstable_mcp_over_agent_transport"]
unstable_protocol_v2 = ["agent-transport-protocol-schema/unstable_protocol_v2"]
unstable_session_fork = ["agent-transport-protocol-schema/unstable_session_fork"]

[lib]
name = "agent_transport_protocol"
path = "src/lib.rs"

[dependencies]
agent-transport-protocol-derive = { path = "../agent_transport_protocol_derive" }
agent-transport-protocol-schema = { path = "../agent_transport_protocol_schema", features = ["tracing"] }
async-process.workspace = true
blocking = "1"
futures.workspace = true
futures-concurrency.workspace = true
rustc-hash.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words = "1.1"
tracing.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
